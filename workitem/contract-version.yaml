schema: workitem-contract-version
version: "1.0"

current: v3

# Contract versions are git tags in harkers/.github. Consumers pin a tag and
# MUST NOT consume an unpinned moving ref. A version with released: null is
# declared but not yet available; only `current` and later tags may be pinned.
versions:
  # Contract versions are git tags in harkers/.github. Consumers pin a tag and
  # MUST NOT consume an unpinned moving ref.
  #
  # `schema_version` maps a tag to the record schema it validates. A contract *data*
  # release -- one that changes the state machine or policy without adding, removing
  # or retyping a field -- keeps the same schema_version. Tightening a constraint is
  # such a release. See the design spec's D8.
  - tag: workitem/v1
    schema_version: "1.0"
    released: "2026-10-03"
    superseded_by: workitem/v1.1
  - tag: workitem/v1.1
    schema_version: "1.0"
    released: "2026-10-03"
    superseded_by: workitem/v2.1
    note: >-
      Delivery-mode reachability fix. Adds no field; tightens the schema so a
      record cannot contradict its delivery.mode.
  - tag: workitem/v2
    schema_version: "2.0"
    released: "2026-10-04"
    superseded_by: workitem/v2.1
    note: >-
      SUPERSEDED IMMEDIATELY. migrations/v1-to-v2.yaml in this tag adds
      external_dependencies but never rewrites schema_version, so a record migrated
      with it still fails v2 validation. Use workitem/v2.1. The schema itself is
      correct and unchanged; only the migration description was wrong. See #20.

  - tag: workitem/v2.1
    schema_version: "2.0"
    released: "2026-10-04"
    note: >-
      Data release: no schema change, schema_version stays 2.0. Carries the corrected
      migrations/v1-to-v2.yaml, which now sets schema_version via the new `set`
      transform. Pin this tag, not workitem/v2. Consumers that already migrated with
      v2 must add external_dependencies AND set schema_version to 2.0.
      External dependency resolution. Adds the required top-level
      external_dependencies[]; dependencies[] and its target pattern are unchanged.
      A dependency is satisfied only by DONE -- CANCELLED satisfies nothing but
      stays reachable, so no record is ever trapped. See
      docs/superpowers/specs/2026-10-04-external-dependency-resolution-design.md.
      Consumers migrating from 1.x need workitem/migrations/v1-to-v2.yaml: this is
      not a pin change, because external_dependencies is required.

  - tag: workitem/v3
    schema_version: "3.0"
    released: "2026-10-04"
    note: >-
      Attested discharge for external dependencies, adopting harkers/workhub
      Decision 0005 option (a). An external_dependencies[] entry discharges EITHER
      by resolved_by (a WorkItem that must be DONE, machine-checked) OR by an
      `attested` block (attributed, timestamped human confirmation) -- exclusively,
      enforced with oneOf and additionalProperties false on both arms.

      Why: v2.1 required discharge by a DONE WorkItem, so WI-20261003-0005 could
      not finish without manufacturing three retrospective WorkItems for issues
      13/14/15 that reached DONE before the ledger tracked them. That is the
      failure Decision 0005 names when rejecting its option (b).

      The weakening, stated: an attested edge cannot be verified by this contract.
      The mitigation is attribution, not verifiability -- by and at are required, so
      an unowned assertion is not expressible. PR_READY precedes DONE, so a
      satisfied attestation carries a record through.

      No v2-to-v3 migration: every v2 record uses resolved_by alone, which remains
      valid under v3. v2.1 and v2 stay pinnable, superseded not withdrawn.

# Version 0.9 is the pre-contract shape, not a released contract version. It is
# recorded here because records exist in the wild that label themselves 1.0 while
# carrying the 17-field shape. Two shapes must never share a version number, so
# 0.9 is the correct name for them and v1 supersedes it.
pre_contract:
  - version: "0.9"
    description: >-
      harkers/workhub's temporary .workhub/workitems compatibility protocol
      (commit f5baf73). Labelled itself schema_version 1.0.
    migration: workitem/migrations/v0.9-to-v1.yaml

resolution:
  repository: harkers/.github
  strategy: pinned_git_tag
  cache:
    required: true
    retain_provenance: true
    provenance_schema: workitem/provenance.schema.json
  note: >-
    GitHub default community-file inheritance is not relied upon for schema
    resolution; WorkHub resolves the contract explicitly.