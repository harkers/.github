name: Security Finding
description: Record a security, abuse, permission, or trust-boundary finding with evidence and mitigation
title: "[Security] "
labels: []
assignees: []
body:
  - type: input
    id: finding_id
    attributes:
      label: Finding ID
      placeholder: SEC-001
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Reviewer / source
      placeholder: titus-cybersecurity-35b / human / external review
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Triggering PR / issue / commit
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Security impact of the finding. Severity is separate from remediation priority.
      options:
        - Critical
        - High
        - Medium
        - Low
        - Informational
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Remediation order from impact and risk, not fix effort. Apply the matching priority:P0–priority:P3 GitHub label where available.
      options:
        - P0 — Critical / immediate remediation / blocks delivery
        - P1 — High / fix before PR_READY unless explicitly authorised waiver
        - P2 — Medium / tracked; normally before unrelated discretionary work
        - P3 — Low / backlog / non-blocking by default
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      multiple: true
      options:
        - authentication
        - authorisation
        - secrets/credentials
        - filesystem/path handling
        - command execution
        - network exposure
        - dependency/supply chain
        - logging/data leakage
        - prompt/tool abuse
        - policy/safety
        - other
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: Attack / failure surface
      description: Describe the exposed surface or trust boundary.
    validations:
      required: true
  - type: textarea
    id: threat
    attributes:
      label: Threat / finding
      description: State the security claim precisely.
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      description: What must be true for the issue to occur or be exploitable?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include file/line, test/log, configuration, and safe reproduction where appropriate.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe credible technical impact without overstating unsupported scenarios.
    validations:
      required: true
  - type: dropdown
    id: exploitability
    attributes:
      label: Exploitability / likelihood
      options:
        - High
        - Medium
        - Low
        - Unknown
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Recommended mitigation
    validations:
      required: true
  - type: dropdown
    id: verification
    attributes:
      label: Verification status
      options:
        - PENDING
        - SUPPORTED
        - REFUTED
        - UNCLEAR
    validations:
      required: true
  - type: checkboxes
    id: specialist_gates
    attributes:
      label: Specialist gates
      options:
        - label: Security/regression test considered.
          required: true
        - label: Policy/safety review considered where relevant.
          required: true
  - type: textarea
    id: resolution
    attributes:
      label: Resolution / residual risk
      description: Link fix commit/PR and document residual risk when resolved.
    validations:
      required: false