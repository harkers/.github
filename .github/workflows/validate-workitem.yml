name: Validate WorkItems

# Reusable validation gate for the canonical WorkItem contract.
#
# A consuming repository calls this to prove its WorkItem instances satisfy the
# canonical contract. The contract is fetched from a PINNED tag, never from a
# moving ref: an unpinned main would let a central change silently invalidate
# every existing WorkItem in every consumer.
#
# Contract: harkers/.github workitem/ at tag workitem/v1
# See workitem/README.md and workitem/contract-version.yaml.
#
# Validation is performed by the contract's own conformance package, which ships
# inside the pinned tag. This workflow deliberately contains no copy of the rules:
# a gate with its own inline implementation would be a second definition of the
# contract, which is the failure mode the contract exists to prevent.

on:
  workflow_call:
    inputs:
      contract-ref:
        description: Pinned contract tag to validate against. Never a branch.
        required: false
        default: workitem/v1
        type: string
      contract-repo:
        description: Repository holding the canonical contract.
        required: false
        default: harkers/.github
        type: string
      gate-ref:
        description: >-
          Tag holding the conformance checker. Separate from contract-ref on
          purpose: the checker and the contract data change for different reasons,
          and coupling them forces a contract release whenever a checker bug is
          fixed. Left unset, falls back to contract-ref.
        required: false
        default: ""
        type: string
      workitem-glob:
        description: Path pattern for WorkItem instances in the calling repository.
        required: false
        default: .workhub/workitems/*/workitem.yaml
        type: string
      require-contract-pin:
        description: Fail when contract-ref is not a pinned contract tag.
        required: false
        default: true
        type: boolean

jobs:
  validate:
    name: Validate WorkItems against ${{ inputs.contract-ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed before anything that imports jsonschema or yaml. The provenance
      # step below needs both, and GitHub runners do not ship them.
      - name: Install the validator
        run: python -m pip install --quiet "jsonschema>=4.21,<5.0" "PyYAML>=6.0,<7.0"

      - name: Reject an unpinned contract ref
        if: ${{ inputs.require-contract-pin }}
        run: |
          if [[ ! "${{ inputs.contract-ref }}" =~ ^workitem/v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::contract-ref '${{ inputs.contract-ref }}' is not a pinned contract tag."
            echo "Consumers MUST pin a tag such as workitem/v1. An unpinned moving ref"
            echo "lets a central schema change invalidate every existing WorkItem."
            exit 1
          fi

      - name: Fetch the contract at the pinned tag and record provenance
        run: |
          set -euo pipefail
          REF="${{ inputs.contract-ref }}"
          REPO="${{ inputs.contract-repo }}"
          GATE_REF="${{ inputs.gate-ref }}"
          if [ -z "$GATE_REF" ]; then GATE_REF="$REF"; fi
          # git needs a URL. `owner/repo` alone is treated as a local path and the
          # fetch fails, so derive the clone URL from the API server. The bare
          # owner/repo pair is what the provenance record records.
          CLONE_URL="${{ github.server_url }}/${REPO}.git"

          # Peel the annotated tag to the COMMIT it points at. `git ls-remote
          # refs/tags/<tag>` returns the tag object sha, not the commit sha, so
          # recording that would misidentify the tree actually checked out.
          git init -q contract
          git -C contract remote add origin "$CLONE_URL"
          git -C contract fetch -q --depth 1 origin "refs/tags/$REF:refs/tags/$REF"
          git -C contract checkout -q "refs/tags/$REF"

          # The checker may be pinned independently of the contract data. When it
          # is, fetch it separately; otherwise the contract tree already has it.
          CHECKER="contract/workitem/conformance"
          if [ "$GATE_REF" != "$REF" ]; then
            git init -q checker
            git -C checker remote add origin "$CLONE_URL"
            git -C checker fetch -q --depth 1 origin "refs/tags/$GATE_REF:refs/tags/$GATE_REF"
            git -C checker checkout -q "refs/tags/$GATE_REF"
            CHECKER="checker/workitem/conformance"
            echo "checker pinned separately at $GATE_REF"
          fi
          test -f "$CHECKER/workitem_conformance/cli.py" || {
            echo "::error::no conformance checker at $CHECKER"
            echo "The contract tag predates the checker. Pin gate-ref to a tag that has it."
            exit 1
          }
          echo "CHECKER_PATH=$CHECKER" >> "$GITHUB_ENV"

          # Written and validated by Python rather than emitted by a heredoc: a
          # heredoc preserves leading whitespace, and an indented mapping is not
          # valid YAML at the document root. Writing it here also lets us check it
          # against the contract's own provenance schema, which the first version
          # did not -- it emitted a record that violated that schema on every run.
          python3 - "$REF" "$REPO" <<'PY'
          import datetime, hashlib, json, pathlib, re, subprocess, sys

          import yaml
          from jsonschema import Draft202012Validator

          contract = pathlib.Path("contract")
          ref, repo = sys.argv[1], sys.argv[2]

          commit_sha = subprocess.run(
              ["git", "-C", str(contract), "rev-parse", "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          # contract_version comes from the contract itself, not from the ref
          # string: `workitem/v1` is a tag, and the provenance schema wants `v1`.
          version_yaml = (contract / "workitem" / "contract-version.yaml").read_text()
          match = re.search(r"^current:\s*(\S+)", version_yaml, re.M)
          contract_version = match.group(1) if match else ref

          schema_path = contract / "workitem" / "v1.schema.json"
          record = {
              "repo": repo,
              "requested_ref": ref,
              "resolved_sha": commit_sha,
              "path": "workitem/v1.schema.json",
              "contract_version": contract_version,
              "fetched_at": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "checksum": hashlib.sha256(schema_path.read_bytes()).hexdigest(),
          }

          schema = json.loads((contract / "workitem" / "provenance.schema.json").read_text())
          errors = sorted(Draft202012Validator(schema).iter_errors(record), key=str)
          if errors:
              print("::error::provenance record violates the contract's own schema")
              for error in errors:
                  print(f"  {error.message}")
              raise SystemExit(1)

          text = yaml.safe_dump(record, sort_keys=False)
          pathlib.Path("provenance.yaml").write_text(text)
          print(text)
          print("provenance conforms to provenance.schema.json")
          PY

      - name: Validate every WorkItem instance with the contract's own checker
        run: |
          set -euo pipefail
          PYTHONPATH="$CHECKER_PATH" python -m workitem_conformance.cli \
            --contract-root contract \
            --ledger-root . \
            --pattern '${{ inputs.workitem-glob }}'

      - name: Upload contract provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workitem-contract-provenance
          path: provenance.yaml
          if-no-files-found: error