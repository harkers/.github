name: Validate WorkItems

# Reusable validation gate for the canonical WorkItem contract.
#
# A consuming repository calls this to prove its WorkItem instances validate
# against the canonical schema. The contract is fetched from a PINNED tag, never
# from a moving ref: an unpinned main would let a central change silently
# invalidate every existing WorkItem in every consumer.
#
# Contract: harkers/.github workitem/ at tag workitem/v1
# See harkers/.github workitem/README.md and workitem/contract-version.yaml.

on:
  workflow_call:
    inputs:
      contract-ref:
        description: Pinned contract tag to validate against. Never a branch.
        required: false
        default: workitem/v1
        type: string
      contract-repo:
        description: Repository holding the canonical contract.
        required: false
        default: harkers/.github
        type: string
      workitem-glob:
        description: Path pattern for WorkItem instances in the calling repository.
        required: false
        default: .workhub/workitems/*/workitem.yaml
        type: string
      require-contract-pin:
        description: Fail when contract-ref is not a pinned contract tag.
        required: false
        default: "true"
        type: boolean

jobs:
  validate:
    name: Validate WorkItems against ${{ inputs.contract-ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4

      - name: Reject an unpinned contract ref
        if: ${{ inputs.require-contract-pin }}
        run: |
          if [[ ! "${{ inputs.contract-ref }}" =~ ^workitem/v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::contract-ref '${{ inputs.contract-ref }}' is not a pinned contract tag."
            echo "Consumers MUST pin a tag such as workitem/v1. An unpinned moving ref"
            echo "lets a central schema change invalidate every existing WorkItem."
            exit 1
          fi

      - name: Fetch the contract at the pinned tag and record provenance
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "${{ inputs.contract-repo }}" "refs/tags/${{ inputs.contract-ref }}" \
                | awk '{print $1}' | head -1)
          if [ -z "$SHA" ]; then
            echo "::error::tag ${{ inputs.contract-ref }} not found in ${{ inputs.contract-repo }}"
            exit 1
          fi
          git clone --depth 1 --branch "${{ inputs.contract-ref }}" "${{ inputs.contract-repo }}" /tmp/contract
          # Provenance: a cached contract must always record what it resolved to.
          CHECKSUM=$(sha256sum /tmp/contract/workitem/v1.schema.json | awk '{print $1}')
          cat > workitem-contract-provenance.yaml <<EOF
          repo: ${{ inputs.contract-repo }}
          requested_ref: ${{ inputs.contract-ref }}
          resolved_sha: $SHA
          path: workitem/v1.schema.json
          contract_version: ${{ inputs.contract-ref }}
          fetched_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          checksum: $CHECKSUM
          EOF
          cat workitem-contract-provenance.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the validator
        run: python -m pip install --quiet "jsonschema>=4.21,<5.0" "PyYAML>=6.0,<7.0"

      - name: Validate every WorkItem instance
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, sys
          import yaml
          from jsonschema import Draft202012Validator

          schema = json.load(open("/tmp/contract/workitem/v1.schema.json"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          paths = sorted(glob.glob("${{ inputs.workitem-glob }}"))
          if not paths:
              print("No WorkItem instances matched '${{ inputs.workitem-glob }}'.")
              print("If this repository holds no WorkItems, remove this gate rather than")
              print("letting it pass vacuously.")
              sys.exit(1)

          failures = 0
          for path in paths:
              with open(path) as fh:
                  item = yaml.safe_load(fh)
              errors = sorted(validator.iter_errors(item), key=str)
              if errors:
                  failures += 1
                  print(f"::error file={path}::")
                  for error in errors:
                      print(f"  {'/'.join(str(p) for p in error.path) or '<root>'}: {error.message}")
              else:
                  print(f"ok: {path}")

          print(f"\n{len(paths) - failures}/{len(paths)} WorkItems valid.")
          sys.exit(1 if failures else 0)
          PY

      - name: Upload contract provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workitem-contract-provenance
          path: workitem-contract-provenance.yaml
          if-no-files-found: error