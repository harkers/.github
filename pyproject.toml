[project]
name = "workitem-conformance"
version = "1.0.0"
description = "Standalone conformance suite for the canonical WorkItem contract"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21,<5.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["workitem/conformance/tests"]
pythonpath = ["workitem/conformance"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Contract code lives in .py files. Markdown under docs/ and workitem/ only
# *quotes* code in fenced blocks; ruff 0.16 formats those too, which would
# rewrite the plan and README without changing a line of executable code.
extend-exclude = ["docs/", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# Resolved through pytest's pythonpath, not installed, so ruff cannot infer it.
known-first-party = ["workitem_conformance"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"